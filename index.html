<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For You ❤️</title>
  <script src="https://cdn.jsdelivr.net/npm/crypto-js@4.1.1/crypto-js.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;700&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: radial-gradient(circle at top, #ff9a9e, #ff4f81);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    .card {
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(25px);
      padding: 28px;
      border-radius: 25px;
      width: 90%;
      max-width: 380px;
      text-align: center;
      color: white;
      box-shadow: 0 20px 60px rgba(0,0,0,0.25);
      animation: fadeIn 1.2s ease;
    }

    h1 { font-size: 1.9rem; }
    p { opacity: 0.9; }

    input, button {
      width: 100%;
      padding: 12px;
      border-radius: 14px;
      border: none;
      margin-top: 15px;
      font-size: 16px;
    }

    button {
      background: linear-gradient(135deg,#ff2e63,#ff6a88);
      color: white;
      transition: 0.3s;
    }

    button:hover { transform: scale(1.05); }

    @keyframes fadeIn {
      from {opacity:0; transform: translateY(20px);} 
      to {opacity:1; transform: translateY(0);} 
    }

    .heart {
      position: absolute;
      animation: float 6s linear infinite;
      opacity: 0.7;
    }

    @keyframes float {
      from { transform: translateY(100vh); }
      to { transform: translateY(-10vh); }
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>💌 A Message For You</h1>
    <p>Some things are meant only for you...</p>
    <input type="password" id="password" placeholder="Enter your secret code ❤️">
    <button onclick="goToLetter()">Unlock ❤️</button>
  </div>

  <script>
    function goToLetter() {
      const password = document.getElementById('password').value;
      if(!password) return alert("Enter the secret code ❤️");
      sessionStorage.setItem("pass", password);
      window.location.href = "letter.html";
    }

    setInterval(() => {
      const heart = document.createElement("div");
      heart.className = "heart";
      heart.innerText = "❤️";
      heart.style.left = Math.random()*100+"vw";
      heart.style.fontSize = (Math.random()*20+15)+"px";
      document.body.appendChild(heart);
      setTimeout(()=>heart.remove(),6000);
    }, 300);
  </script>
</body>
</html>
