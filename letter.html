
<!-- letter.html improved -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Letter ❤️</title>
  <script src="https://cdn.jsdelivr.net/npm/crypto-js@4.1.1/crypto-js.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;700&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(180deg, #fff1f5, #ffe4ec);
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
      padding: 20px;
    }

    .letter {
      width: 100%;
      max-width: 700px;
      background: #f9eaf7;
      border-radius: 20px;
      padding: 25px 20px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.15);
      font-family: 'Dancing Script', cursive;
      font-size: 1.3rem;
      line-height: 1.9;
      color: #5a2a2a;
      animation: fadeIn 1s ease;
    }

    h2 {
      text-align: center;
      color: #ff2e63;
      margin-bottom: 10px;
    }

    #content {
      margin-top: 15px;
      white-space: pre-wrap;
    }

    .error {
      text-align: center;
      color: #ff2e63;
      font-family: sans-serif;
    }

    @keyframes fadeIn {
      from {opacity:0; transform: translateY(20px);} 
      to {opacity:1; transform: translateY(0);} 
    }

    @media (max-width: 480px) {
      .letter {
        font-size: 1.15rem;
        padding: 20px 15px;
      }
    }
  </style>
</head>
<body>

  <!-- softer romantic instrumental -->
  <audio autoplay loop>
    <source src="https://www.bensound.com/bensound-music/bensound-romantic.mp3" type="audio/mpeg">
  </audio>

  <div class="letter">
    <h2>❤️ For You ❤️</h2>
    <div id="content">Unlocking your letter...</div>
  </div>

  <script>
    function typeWriter(text, element, speed=100) {
      let i = 0;
      element.innerHTML = "";
      function typing() {
        if (i < text.length) {
          element.innerHTML += text.charAt(i);
          i++;
          setTimeout(typing, speed);
        }
      }
      typing();
    }

    async function loadLetter() {
      const password = sessionStorage.getItem("pass");
      const el = document.getElementById("content");

      try {
        const response = await fetch('encrypted.txt?nocache=' + new Date().getTime());
        const encrypted = await response.text();

        const decrypted = CryptoJS.AES.decrypt(encrypted, password)
          .toString(CryptoJS.enc.Utf8);

        if (!decrypted) throw new Error();

        typeWriter(decrypted, el);

      } catch {
        el.innerHTML = "💔 Maybe this wasn’t the right moment... or the code didn’t match what my heart remembers.";
        el.classList.add("error");
      }
    }

    loadLetter();
  </script>
</body>
</html>
